services:
  postgres:
    image: postgres:18-alpine
    container_name: electrotrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  servicios:
    build:
      context: ./servicios
      dockerfile: Dockerfile
    container_name: electrotrack-servicios
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  actividades:
    build:
      context: ./actividades
      dockerfile: Dockerfile
    container_name: electrotrack-actividades
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ELECTROTRACK_EVIDENCIAS_DIRECTORIO: /app/uploads/evidencias
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - evidencias_data:/app/uploads/evidencias
    depends_on:
      postgres:
        condition: service_healthy

  jornada:
    build:
      context: ./jornada
      dockerfile: Dockerfile
    container_name: electrotrack-jornada
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  evidencias_data:
