
server:
  port: 8083

spring:
  application:
    name: actividades

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electrotrack_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: actividades

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

electrotrack:
  evidencias:
    directorio: uploads/evidencias
